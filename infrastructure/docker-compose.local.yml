services:

  postgres:
    image: postgres:16-alpine
    container_name: vit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vitelectronics
    ports:
      - "5433:5432"
    volumes:
      - vit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: run the full app stack in containers too.
  #   docker compose -f infrastructure/docker-compose.local.yml --profile full up -d --build
  # Normally these are run with `npm run start:dev` / `npm run dev` outside Docker.
  backend:
    profiles: ["full"]
    build:
      context: ../backend
    container_name: vit-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/vitelectronics?schema=public"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    container_name: vit-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: "http://backend:3001"
      NEXTAUTH_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vit_postgres_data:
  vit_redis_data: